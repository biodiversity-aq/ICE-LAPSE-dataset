[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-lapse-dataset"
version = "0.1.0"
description = "Convert the ICE-LAPSE image dataset to Camtrap-DP and deposit its images on Zenodo"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.scripts]
ice-lapse-camtrap-dp = "ice_lapse.camtrap_dp.build:main"
ice-lapse-zenodo = "ice_lapse.zenodo.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
